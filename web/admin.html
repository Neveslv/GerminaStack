<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administração | GerminaStack</title>
    <link rel="stylesheet" href="/static/vendor/germinastack/css/germinastack.css" />
    <link rel="stylesheet" href="/static/vendor/germinastack/themes.css" />
    <link rel="stylesheet" href="/static/vendor/germinastack/notifications.css" />
    <script src="/static/js/tema-inicial.js"></script>
    <script src="/static/vendor/germinastack/js/germinastack.js" defer></script>
    <script type="module" src="/static/js/componentes/cabecalho.js"></script>
    <script type="module" src="/static/js/pages/admin.js"></script>
</head>
<body>
    <a class="gs-skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>
    <header class="gs-topbar"><a class="gs-brand" href="/"><span class="gs-brand-mark" aria-hidden="true">GS</span><span>GerminaStack</span></a></header>
    <main class="gs-page" id="conteudo-principal">
        <div class="gs-stack" style="max-width: 62rem; margin: 0 auto;">
            <section class="gs-card"><h1 class="gs-card-title">Administração</h1><p class="gs-card-subtitle">Moderação de usuários e publicações.</p></section>
            <section class="gs-stack"><h2 class="gs-side-title">Usuários</h2><input class="gs-input" id="busca-usuarios" type="search" aria-label="Buscar usuário" placeholder="Buscar usuário" /><div id="estado-admin" role="status" aria-live="polite"></div><div class="gs-stack" id="usuarios-admin" aria-live="polite" aria-label="Lista de usuários administrativos"></div><div class="gs-cluster" id="paginacao-usuarios"></div></section>
            <section class="gs-stack"><h2 class="gs-side-title">Publicações</h2><input class="gs-input" id="busca-posts" type="search" placeholder="Buscar publicação ou autor" /><div class="gs-stack" id="posts-admin"></div><div class="gs-cluster" id="paginacao-posts"></div></section>
        </div>
    </main>
</body>
</html>
