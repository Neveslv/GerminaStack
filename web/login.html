<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | GerminaStack</title>
    <meta name="description" content="Entre com sua conta do Germinare para publicar e responder." />

    <link rel="stylesheet" href="/static/vendor/germinastack/css/germinastack.css" />
    <link rel="stylesheet" href="/static/vendor/germinastack/themes.css" />

    <!-- Sem defer de proposito: aplica o tema salvo antes da primeira pintura. -->
    <script src="/static/js/tema-inicial.js"></script>

    <script src="/static/vendor/germinastack/js/germinastack.js" defer></script>
    <script type="module" src="/static/js/pages/login.js"></script>
</head>

<body>
    <a class="gs-skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

    <header class="gs-topbar">
        <a class="gs-brand" href="/">
            <span class="gs-brand-mark" aria-hidden="true">GS</span>
            <span>GerminaStack</span>
        </a>

        <nav class="gs-nav" aria-label="Navegação principal">
            <a class="gs-nav-link" href="/">Feed</a>
            <a class="gs-nav-link" href="/preferencias">Acessibilidade</a>
        </nav>
    </header>

    <main class="gs-page" id="conteudo-principal">
        <div style="max-width: 26rem; margin: 0 auto;">
            <div class="gs-section-head">
                <h1>Entrar</h1>
                <p>Use seu e-mail institucional. Você receberá um código de confirmação.</p>
            </div>

            <div id="estado-login" role="status" aria-live="polite" hidden></div>

            <div class="gs-card">
                <form class="gs-stack" id="form-login" novalidate>
                    <label class="gs-form-group" for="email">
                        <span class="gs-label">E-mail institucional</span>
                        <input class="gs-input" type="email" id="email" name="email" required autocomplete="username"
                            aria-describedby="erro-email" />
                        <span class="gs-form-error" id="erro-email" role="alert"></span>
                    </label>

                    <label class="gs-form-group" id="grupo-codigo" for="codigo" hidden>
                        <span class="gs-label">Código de confirmação</span>
                        <input class="gs-input" type="text" id="codigo" name="codigo" inputmode="numeric"
                            autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"
                            aria-describedby="erro-codigo" />
                        <span class="gs-form-error" id="erro-codigo" role="alert"></span>
                    </label>

                    <label class="gs-form-group" for="senha">
                        <span class="gs-label">Senha</span>
                        <input class="gs-input" type="password" id="senha" name="senha" required
                            autocomplete="current-password" aria-describedby="erro-senha" />
                        <span class="gs-form-error" id="erro-senha" role="alert"></span>
                    </label>

                    <button class="gs-btn gs-btn-primary" type="submit">Entrar</button>
                </form>
            </div>

            <p style="margin-top: 16px; text-align: center;">
                Ainda não tem conta? <a href="/cadastro">Criar uma conta</a>
            </p>
        </div>
    </main>
</body>

</html>
