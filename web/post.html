<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Publicação | GerminaStack</title>
    <meta name="description" content="Discussao completa da publicacao, com as respostas da turma." />

    <link rel="stylesheet" href="/static/vendor/germinastack/css/germinastack.css" />
    <link rel="stylesheet" href="/static/vendor/germinastack/themes.css" />
    <link rel="stylesheet" href="/static/vendor/germinastack/notifications.css" />

    <!-- Sem defer de proposito: aplica o tema salvo antes da primeira pintura. -->
    <script src="/static/js/tema-inicial.js"></script>

    <script src="/static/vendor/germinastack/js/germinastack.js" defer></script>
    <script type="module" src="/static/js/componentes/cabecalho.js"></script>
    <script type="module" src="/static/js/pages/post.js"></script>
</head>

<body>
    <a class="gs-skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

    <header class="gs-topbar">
        <a class="gs-brand" href="/">
            <span class="gs-brand-mark" aria-hidden="true">GS</span>
            <span>GerminaStack</span>
        </a>

        <nav class="gs-nav" aria-label="Navegação principal">
            <a class="gs-nav-link" href="/">Feed</a>
            <a class="gs-nav-link" href="/materias">Matérias</a>
            <a class="gs-nav-link" href="/publicar">Publicar</a>
            <div class="gs-menu" data-gs-menu>
                <button class="gs-nav-link" type="button" data-gs-menu-trigger aria-haspopup="menu"
                    aria-expanded="false">
                    Notificações
                    <span class="gs-badge" data-nao-lidas hidden></span>
                </button>
                <div class="gs-menu-panel gs-notif-panel" data-gs-menu-panel hidden>
                    <div class="gs-notif-head">
                        <strong>Notificações</strong>
                        <button class="gs-btn gs-btn-ghost" type="button" data-notif-marcar-lidas disabled>
                            Marcar todas como lidas
                        </button>
                    </div>
                    <div class="gs-notif-lista" data-notif-lista></div>
                </div>
            </div>
            <a class="gs-nav-link" href="/preferencias">Acessibilidade</a>
            <a class="gs-nav-link" href="/perfil">Perfil</a>
        </nav>
    </header>

    <main class="gs-page" id="conteudo-principal">
        <div class="gs-stack" style="max-width: 42rem; margin: 0 auto;">
            <p><a href="/">← Voltar para o feed</a></p>

            <div id="estado-post" role="status" aria-live="polite" hidden></div>

            <div id="publicacao"></div>

            <section class="gs-stack" aria-labelledby="titulo-respostas">
                <h2 class="gs-side-title" id="titulo-respostas">Respostas</h2>

                <div class="gs-card">
                    <form class="gs-stack" id="form-resposta" novalidate>
                        <label class="gs-form-group" for="nova-resposta">
                            <span class="gs-label">Responder esta publicação</span>
                            <textarea class="gs-textarea" id="nova-resposta" name="resposta" rows="3" required
                                maxlength="500" placeholder="Escreva uma resposta ou cole um link direto de GIF" aria-describedby="dica-resposta erro-resposta"></textarea>
                            <span class="gs-form-hint" id="dica-resposta">
                                Até 500 caracteres. Links diretos terminados em .gif são exibidos como GIFs.
                            </span>
                            <span class="gs-form-error" id="erro-resposta" role="alert"></span>
                        </label>

                        <div class="gs-compose-foot">
                            <button class="gs-btn gs-btn-primary" type="submit">Responder</button>
                        </div>
                    </form>
                </div>

                <div id="estado-respostas" role="status" aria-live="polite" hidden></div>

                <div id="thread"></div>
            </section>
        </div>
    </main>
</body>

</html>
