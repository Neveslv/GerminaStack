<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova publicação | GerminaStack</title>
    <meta name="description" content="Publique uma duvida, um resumo ou um material para a turma." />
    <link rel="stylesheet" href="/static/vendor/germinastack-ui-components/assets/css/germinastack.css" />
    <script src="/static/vendor/germinastack-ui-components/assets/js/germinastack.js" defer></script>
    <script type="module" src="/static/js/pages/publicar.js"></script>
</head>

<body>
    <a class="gs-skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

    <header class="gs-topbar">
        <a class="gs-brand" href="/">
            <span class="gs-brand-mark">GS</span>
            <span>GerminaStack</span>
        </a>

        <nav class="gs-nav" aria-label="Navegação principal">
            <a class="gs-nav-link" href="/">Feed</a>
            <a class="gs-nav-link is-active" href="/publicar" aria-current="page">Publicar</a>
            <a class="gs-nav-link" href="/login">Entrar</a>
        </nav>
    </header>

    <main class="gs-page" id="conteudo-principal">
        <div style="max-width: 34rem; margin: 0 auto;">
            <div class="gs-section-head">
                <h1>Nova publicação</h1>
                <p>Escreva a dúvida ou o material. Quem estiver na mesma matéria vai ver no feed.</p>
            </div>

            <div id="estado-formulario" role="status" aria-live="polite" hidden></div>

            <div class="gs-card">
                <form class="gs-stack" id="form-publicar" novalidate>
                    <label class="gs-form-group" for="materia">
                        <span class="gs-label">Matéria</span>
                        <span class="gs-select-native">
                            <select id="materia" name="materia" required aria-describedby="erro-materia">
                                <option value="">Selecione uma matéria</option>
                            </select>
                        </span>
                        <span class="gs-form-error" id="erro-materia" role="alert"></span>
                    </label>

                    <label class="gs-form-group" for="titulo">
                        <span class="gs-label">Título</span>
                        <input class="gs-input" type="text" id="titulo" name="titulo" required maxlength="120"
                            aria-describedby="dica-titulo erro-titulo" />
                        <span class="gs-form-hint" id="dica-titulo">Resuma a dúvida em uma frase. Até 120
                            caracteres.</span>
                        <span class="gs-form-error" id="erro-titulo" role="alert"></span>
                    </label>

                    <label class="gs-form-group" for="conteudo-post">
                        <span class="gs-label">Conteúdo</span>
                        <textarea class="gs-textarea" id="conteudo-post" name="conteudo" rows="8" required
                            aria-describedby="dica-conteudo erro-conteudo"></textarea>
                        <span class="gs-form-hint" id="dica-conteudo">Explique o que você já tentou. Use @usuario para
                            chamar alguém.</span>
                        <span class="gs-form-error" id="erro-conteudo" role="alert"></span>
                    </label>

                    <div class="gs-compose-foot">
                        <a class="gs-btn gs-btn-ghost" href="/">Cancelar</a>
                        <button class="gs-btn gs-btn-primary" type="submit">Publicar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
